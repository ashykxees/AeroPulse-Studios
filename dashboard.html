<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | AeroPulse Studios</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">A</span>
        <span>AeroPulse Studios</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="games.html">Games</a></li>
          <li><a href="team.html">Team</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="/dashboard" class="active">Dashboard</a></li>
        </ul>
      </nav>
      <a href="/auth/logout" class="nav-cta">Logout</a>
      <button class="mobile-menu-btn" aria-label="Open menu">&#9776;</button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="team.html">Team</a>
      <a href="contact.html">Contact</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/auth/logout">Logout</a>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <span class="section-label">Dashboard</span>
          <h1 class="display">DJ Empire</h1>
        </div>
        <div class="dashboard-user" id="userInfo">
          <span id="username">Loading...</span>
          <img id="avatar" src="" alt="" class="dashboard-avatar" hidden>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Your Equity</h3>
          <div class="value accent" id="equityValue">0%</div>
        </div>
        <div class="dashboard-card">
          <h3>Total DJ Empire Earnings</h3>
          <div class="value" id="totalEarnings">0 R$</div>
        </div>
        <div class="dashboard-card">
          <h3>Your Earnings</h3>
          <div class="value accent" id="yourEarnings">0 R$</div>
        </div>
      </div>

      <div class="admin-panel" id="adminPanel" hidden>
        <h2 class="display">Admin Controls</h2>

        <form class="admin-form" id="earningsForm">
          <div class="form-group">
            <label for="earningsInput">Total DJ Empire Earnings (R$)</label>
            <input type="number" id="earningsInput" name="amount" placeholder="20000" min="0" required>
          </div>
          <div></div>
          <button type="submit" class="btn btn-primary">Update Earnings</button>
        </form>

        <form class="admin-form" id="equityForm">
          <div class="form-group">
            <label for="equityUser">Discord User ID</label>
            <input type="text" id="equityUser" name="userId" placeholder="123456789012345678" required>
          </div>
          <div class="form-group">
            <label for="equityPercent">Equity %</label>
            <input type="number" id="equityPercent" name="percent" placeholder="20" min="0" max="100" required>
          </div>
          <button type="submit" class="btn btn-primary">Set Equity</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    async function loadDashboard() {
      try {
        const [meRes, equityRes] = await Promise.all([fetch('/api/me'), fetch('/api/equity')]);
        if (!meRes.ok) return window.location.href = '/login.html';

        const me = await meRes.json();
        const equity = await equityRes.json();

        document.getElementById('username').textContent = me.user.username;
        const avatar = document.getElementById('avatar');
        if (me.user.avatar) {
          avatar.src = me.user.avatar;
          avatar.hidden = false;
        }

        document.getElementById('equityValue').textContent = equity.equity + '%';
        document.getElementById('totalEarnings').textContent = equity.totalEarnings.toLocaleString() + ' R$';
        document.getElementById('yourEarnings').textContent = equity.yourEarnings.toLocaleString() + ' R$';

        if (me.isAdmin) {
          document.getElementById('adminPanel').hidden = false;
          document.getElementById('earningsInput').value = equity.totalEarnings;
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('earningsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/admin/earnings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: form.amount.value })
      });
      if (res.ok) {
        loadDashboard();
      }
    });

    document.getElementById('equityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/admin/equity', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: form.userId.value, percent: form.percent.value })
      });
      if (res.ok) {
        form.reset();
        loadDashboard();
      }
    });

    loadDashboard();
  </script>
</body>
</html>
